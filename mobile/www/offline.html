<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Astro Rishi - offline</title>
<style>
:root{--bg:#f4f1ec;--ink:#23201c;--accent:#8a4b14}
@media (prefers-color-scheme:dark){:root{--bg:#1c1a17;--ink:#f1ece4;--accent:#e0a35e}}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:17px system-ui,sans-serif}
body{display:grid;place-items:center;text-align:center;padding:1.5rem}
.om{font-size:64px;color:var(--accent)}h1{font-size:1.3rem;margin:.4rem 0}
p{opacity:.75;max-width:22rem}
button{margin-top:1rem;padding:.7rem 1.6rem;font-size:1rem;border:0;border-radius:.6rem;background:var(--accent);color:#fff}
</style></head>
<body><div><div class="om">&#x1F549;</div><h1>No internet connection</h1>
<p>Astro Rishi needs an internet connection. Check your connection and try again.</p>
<button onclick="location.href='https://app.astro-rishi.in'">Try again</button></div></body></html>
