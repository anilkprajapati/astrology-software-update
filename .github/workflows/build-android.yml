name: Build Android app

# Run from the Actions tab. Makes a debug APK you can install on any Android phone (allow "install unknown apps").
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: npm install
      - name: Create the Android project
        run: npx cap add android
      - name: App icons and splash screen
        run: npx capacitor-assets generate --android
      - name: Sync
        run: npx cap sync android
      - name: Build the debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AstroRishi-Android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
