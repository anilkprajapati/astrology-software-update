name: Build iOS app

# Run from the Actions tab. Makes an UNSIGNED simulator build to test on a Mac (Xcode > Simulator).
# A build that installs on a real iPhone / goes to the App Store needs an Apple Developer account (signing).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Create the iOS project
        run: npx cap add ios
      - name: App icons and splash screen
        run: npx capacitor-assets generate --ios
      - name: Sync
        run: npx cap sync ios
      - name: Build for the simulator
        working-directory: mobile/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Zip the app
        run: |
          cd ios/App/build/Build/Products/Debug-iphonesimulator
          zip -r "$GITHUB_WORKSPACE/mobile/AstroRishi-iOS-simulator.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: AstroRishi-iOS-simulator
          path: mobile/AstroRishi-iOS-simulator.zip
          retention-days: 30
